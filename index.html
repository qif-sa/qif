<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>قَيف - Qif</title>
    <link rel="icon" type="image/png" href="icon.png">
    <link rel="preload" as="image" href="pg.png">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            min-height: 100vh;
            min-height: 100dvh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            background: #000;
            position: relative;
            overflow-x: hidden;
        }

        #bg {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: url('pg.png') center/cover no-repeat;
            z-index: 0;
        }

        #bg::after {
            content: '';
            position: absolute;
            inset: 0;
            background: rgba(0, 0, 0, 0.4);
        }

        .container {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 400px;
            display: flex;
            flex-direction: column;
            gap: 14px;
            padding: 20px 0;
            margin-top: 120px;
        }

        .link {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 16px 20px;
            border-radius: 14px;
            text-decoration: none;
            color: #fff;
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.12);
            transition: all 0.25s ease;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
            opacity: 0;
            animation: slideIn 0.5s ease forwards;
        }

        .link:nth-child(1) { animation-delay: 0.1s; }
        .link:nth-child(2) { animation-delay: 0.25s; }
        .link:nth-child(3) { animation-delay: 0.4s; }
        .link:nth-child(4) { animation-delay: 0.55s; }
        .link:nth-child(5) { animation-delay: 0.7s; }

        @keyframes slideIn {
            from { opacity: 0; transform: translateX(-40px); }
            to   { opacity: 1; transform: translateX(0); }
        }

        .link:hover {
            background: rgba(255, 255, 255, 0.2);
            transform: translateY(-2px) scale(1.02);
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.35);
        }

        .link:active {
            transform: translateY(0) scale(0.98);
        }

        .link i {
            position: absolute;
            left: 20px;
            font-size: 1.4rem;
        }

        .link .label {
            font-size: 15px;
            font-weight: 600;
            letter-spacing: 0.3px;
        }

        @media (max-width: 480px) {
            .container { padding: 15px; }
            .link { padding: 14px 20px; }
            .link .label { font-size: 14px; }
        }
    </style>
</head>
<body>
    <div id="bg"></div>

    <div class="container">

        <a href="https://qif-sa.github.io/menu/" target="_blank" rel="noopener noreferrer" class="link">
            <i class="fas fa-bars"></i>
            <span class="label">Menu</span>
        </a>

        <a href="https://www.tiktok.com/@qif_sa" target="_blank" rel="noopener noreferrer" class="link">
            <i class="fab fa-tiktok"></i>
            <span class="label">TikTok</span>
        </a>

        <a href="https://www.instagram.com/qif_sa" target="_blank" rel="noopener noreferrer" class="link">
            <i class="fab fa-instagram"></i>
            <span class="label">Instagram</span>
        </a>

        <a href="https://www.snapchat.com/add/qif_sa" target="_blank" rel="noopener noreferrer" class="link">
            <i class="fab fa-snapchat-ghost"></i>
            <span class="label">Snapchat</span>
        </a>

        <a href="https://maps.app.goo.gl/XGEEVWECvXbAWX2F7?g_st=ipc" target="_blank" rel="noopener noreferrer" class="link">
            <i class="fas fa-map-marker-alt"></i>
            <span class="label">Google Maps</span>
        </a>

    </div>
</body>
</html>
